<style>
:root{
  --navy:#14233C; --gold:#C4A95A; --gold-2:#D7C380; --gold-soft:#F4EDD6;
  --bg:#EEF2F6; --surface:#FFFFFF; --ink:#14233C; --muted:#5D6B7C; --line:#D9E0E8; --field:#F7F9FB;
  --ok:#2E7D5B; --ok-soft:#DDF0E7; --warn:#A8671B; --warn-soft:#F8E9D2; --bad:#B23B3B; --bad-soft:#F6DEDE;
  --head:#14233C;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1624; --surface:#15223A; --ink:#E7ECF3; --muted:#9AA8BA; --line:#26364F; --field:#101B2E;
    --gold:#D7C380; --gold-soft:#3A3220;
    --ok:#5CC195; --ok-soft:#173A2D; --warn:#E3A452; --warn-soft:#3B2C17; --bad:#E27070; --bad-soft:#3D1D1F;
    --head:#0A1220; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1624; --surface:#15223A; --ink:#E7ECF3; --muted:#9AA8BA; --line:#26364F; --field:#101B2E;
  --gold:#D7C380; --gold-soft:#3A3220;
  --ok:#5CC195; --ok-soft:#173A2D; --warn:#E3A452; --warn-soft:#3B2C17; --bad:#E27070; --bad-soft:#3D1D1F;
  --head:#0A1220; color-scheme:dark;
}
*{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:15px;line-height:1.55;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.top{background:var(--head);color:#fff;border-bottom:3px solid var(--gold-2)}
.top-in{max-width:1320px;margin:0 auto;padding:16px 20px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px}
.brand img{height:52px;width:auto;display:block}
.brand h1{margin:0;font-size:1.25rem;font-weight:700}
.brand p{margin:0;font-size:.82rem;color:#B9C6D6}
.sync{display:inline-flex;align-items:center;gap:7px;font-size:.82rem;color:#D5DEE9;padding:6px 10px;border:1px solid rgba(255,255,255,.18);border-radius:999px}
.dot{width:8px;height:8px;border-radius:50%;background:#8795A7}
.sync.on .dot{background:#4CD49A;box-shadow:0 0 0 3px rgba(76,212,154,.25)}
.sync.off .dot{background:#E27070}
nav.tabs{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.tabs-in{max-width:1320px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;padding:0 12px}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:13px 14px 11px;white-space:nowrap;color:var(--muted);font-weight:500}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold);font-weight:600}
main{max-width:1320px;margin:0 auto;padding:20px}
.notice{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:.9rem}
.toast{position:fixed;inset-inline:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));margin:auto;width:max-content;max-width:90vw;background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.25);z-index:50;font-size:.92rem}
.toast.err{background:var(--bad)}
.sec-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px;margin:0 0 14px}
.sec-head h2{margin:0;font-size:1.15rem}
.sec-head p{margin:2px 0 0;color:var(--muted);font-size:.88rem}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:500;white-space:nowrap}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
:root[data-theme="dark"] .btn.primary{background:var(--gold);border-color:var(--gold);color:#14233C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{background:var(--gold);border-color:var(--gold);color:#14233C}}
.btn.gold{background:var(--gold-soft);border-color:var(--gold);color:var(--ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:.85rem}
.btn[disabled]{opacity:.55;cursor:default}
.kpis{background:var(--navy);color:#fff;border-radius:14px;display:grid;grid-template-columns:repeat(4,1fr);overflow:hidden;margin-bottom:18px}
.kpi{padding:16px;border-inline-start:1px solid rgba(255,255,255,.1)}
.kpi:first-child{border-inline-start:0}
.kpi .lbl{font-size:.8rem;color:#AFC0D3}
.kpi .val{font-size:1.5rem;font-weight:700;margin-top:4px;direction:ltr;text-align:right}
.kpi .val small{font-size:.8rem;color:#AFC0D3;font-weight:500}
.kpi.gold .val{color:var(--gold-2)}
.kpi.neg .val{color:#F19494}
@media (max-width:700px){.kpis{grid-template-columns:repeat(2,1fr)}.kpi:nth-child(3){border-inline-start:0}.kpi:nth-child(n+3){border-top:1px solid rgba(255,255,255,.1)}.kpi .val{font-size:1.2rem}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.filters input,.filters select{background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.filters input{flex:1 1 220px}
.tbl-wrap{overflow-x:auto}
table.list{width:100%;border-collapse:collapse;font-size:.92rem}
table.list th{text-align:right;font-weight:600;color:var(--muted);font-size:.82rem;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.list td{padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.list tr.row{cursor:pointer}
table.list tr.row:hover td{background:var(--field)}
.num{direction:ltr;text-align:right;unicode-bidi:plaintext}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.8rem;font-weight:600}
.pill.paid{background:var(--ok-soft);color:var(--ok)}
.pill.partial{background:var(--gold-soft);color:var(--ink)}
.pill.unpaid{background:var(--field);color:var(--muted);border:1px solid var(--line)}
.pill.overdue{background:var(--bad-soft);color:var(--bad)}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.empty .btn{margin-top:12px}
/* Editor */
.ed{display:grid;grid-template-columns:minmax(340px,440px) 1fr;gap:18px;align-items:start}
@media (max-width:980px){.ed{grid-template-columns:1fr}}
.form{display:flex;flex-direction:column;gap:14px}
.fs{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.fs h3{margin:0 0 10px;font-size:.95rem}
.fs h3 small{color:var(--muted);font-weight:400}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fr.one{grid-template-columns:1fr}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted)}
label.f input,label.f select,label.f textarea,.item input{background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);font-size:.92rem;min-width:0;width:100%}
label.f textarea{resize:vertical;min-height:64px}
.ro{background:var(--field);border:1px dashed var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);font-size:.92rem}
.item{display:grid;grid-template-columns:1fr 64px 90px 30px;gap:6px;margin-bottom:6px;align-items:center}
.item .x{background:none;border:0;color:var(--muted);font-size:1.2rem;padding:0;line-height:1}
.item-h{display:grid;grid-template-columns:1fr 64px 90px 30px;gap:6px;font-size:.75rem;color:var(--muted);margin-bottom:4px}
.sum{display:flex;flex-direction:column;gap:4px;font-size:.9rem;margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
.sum div{display:flex;justify-content:space-between}
.sum .big{font-weight:700;font-size:1rem}
.form-actions{display:flex;gap:8px;flex-wrap:wrap}
.pv{position:sticky;top:60px}
@media (max-width:980px){.pv{position:static}}
.pv-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.pv-wrap{background:#C9D2DC;border-radius:12px;padding:14px;overflow:hidden}
:root[data-theme="dark"] .pv-wrap{background:#0A1220}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pv-wrap{background:#0A1220}}
.scaler{transform-origin:top right;width:794px}
.busy{opacity:.6;pointer-events:none}

/* ===== Invoice sheet (fixed A4 @ 96dpi, system fonts so export matches preview) ===== */
.sheet{width:794px;min-height:1123px;background:#fff;color:#1B2433;position:relative;display:flex;flex-direction:column;direction:rtl;
  font-family:Tahoma,"Segoe UI","Geeza Pro","Noto Naskh Arabic","Arial",sans-serif;font-size:13px;line-height:1.5;box-shadow:0 4px 18px rgba(0,0,0,.18);overflow:hidden}
.sheet *{letter-spacing:0}
.s-ribbon{display:flex;justify-content:space-between;align-items:center;padding:7px 40px;font-size:12px;font-weight:700;color:#fff;background:#14233C}
.s-ribbon.company{background:#9C8338}
.s-ribbon span.en{font-family:Arial,sans-serif;letter-spacing:.12em;font-weight:700;font-size:11px}
.s-head{display:flex;justify-content:space-between;align-items:center;padding:28px 40px 22px;border-bottom:2px solid #D7C380}
.s-brand{display:flex;align-items:center;gap:14px}
.s-brand img{height:74px;width:auto;display:block}
.s-brand b{display:block;font-size:20px;color:#14233C}
.s-brand i{display:block;font-style:normal;font-family:Arial,sans-serif;font-size:12px;color:#6B7686;letter-spacing:.08em;text-transform:uppercase}
.s-brand small{display:block;font-size:11.5px;color:#6B7686}
.s-title{text-align:left}
.s-title h2{margin:0;font-size:30px;color:#14233C;line-height:1.1}
.s-title .en{font-family:Arial,sans-serif;font-size:13px;letter-spacing:.35em;color:#9C8338;font-weight:700}
.s-meta{display:flex;justify-content:space-between;gap:24px;padding:22px 40px}
.s-bill{flex:1}
.s-lbl{font-size:11px;color:#9C8338;font-weight:700;margin-bottom:4px}
.s-lbl .en{font-family:Arial,sans-serif;letter-spacing:.06em}
.s-bill b{display:block;font-size:16px;color:#14233C;margin-bottom:2px}
.s-bill div{color:#4A5566}
table.s-kv{border-collapse:collapse;min-width:270px}
table.s-kv td{padding:4px 0;font-size:12.5px}
table.s-kv td:first-child{color:#6B7686;padding-left:16px}
table.s-kv td:last-child{text-align:left;font-weight:700;color:#14233C;direction:ltr}
table.s-items{width:calc(100% - 80px);margin:4px 40px 0;border-collapse:collapse}
table.s-items th{background:#14233C;color:#fff;font-weight:700;font-size:12px;padding:9px 10px;text-align:right}
table.s-items th .en{display:block;font-family:Arial,sans-serif;font-size:9.5px;font-weight:400;color:#C9D4E1;letter-spacing:.06em}
table.s-items td{padding:10px;border-bottom:1px solid #E4E8EE;vertical-align:top}
table.s-items tr:nth-child(even) td{background:#FAF8F1}
table.s-items .c{text-align:center;width:36px;color:#6B7686}
table.s-items .n{text-align:left;direction:ltr;white-space:nowrap;width:110px}
table.s-items .q{text-align:center;width:60px}
.s-bottom{display:flex;justify-content:space-between;gap:28px;padding:20px 40px 0}
.s-notes{flex:1;font-size:12px;color:#4A5566}
.s-notes .blk{margin-bottom:14px}
.s-notes .blk div{white-space:pre-wrap}
.s-notes .box{border:1px dashed #C9A24A;background:#FBF7EA;border-radius:6px;padding:10px 12px}
table.s-tot{border-collapse:collapse;width:330px;align-self:flex-start}
table.s-tot td{padding:6px 12px;font-size:12.5px}
table.s-tot td:last-child{text-align:left;direction:ltr;font-weight:700;white-space:nowrap}
table.s-tot tr.grand td{background:#14233C;color:#fff;font-size:15px;padding:10px 12px}
table.s-tot tr.bal td{background:#F4EDD6;color:#14233C;font-size:14px}
table.s-tot .en{font-family:Arial,sans-serif;font-size:10px;color:#8A93A1;margin-right:6px;white-space:nowrap}
table.s-tot td:first-child{white-space:nowrap}
table.s-tot tr.grand .en{color:#C9D4E1}
.s-sign{display:flex;justify-content:space-between;gap:40px;padding:34px 40px 0}
.s-sign div{flex:1;border-top:1px solid #9AA4B2;padding-top:6px;text-align:center;font-size:11.5px;color:#6B7686}
.s-stamp{position:absolute;top:212px;left:318px;transform:rotate(-14deg);border:3px solid #2E7D5B;color:#2E7D5B;border-radius:10px;padding:6px 18px;text-align:center;font-weight:700;font-size:22px;opacity:.8}
.s-stamp .en{display:block;font-family:Arial,sans-serif;font-size:12px;letter-spacing:.3em}
.s-stamp.partial{border-color:#9C8338;color:#9C8338;font-size:18px}
.s-foot{margin-top:auto;padding:16px 40px 20px;border-top:3px solid #D7C380;display:flex;flex-wrap:wrap;justify-content:center;gap:6px 18px;font-size:11px;color:#6B7686}
.s-foot span{direction:ltr;unicode-bidi:plaintext}
.sheet.rc{min-height:561px;height:561px}
.r-head{display:flex;justify-content:space-between;align-items:center;padding:12px 34px 10px;border-bottom:2px solid #D7C380}
.r-head .s-brand img{height:50px}
.r-head .s-brand b{font-size:16px}
.r-title{text-align:center}
.r-title h2{margin:0;font-size:21px;color:#14233C;line-height:1.2}
.r-title .en{font-family:Arial,sans-serif;font-size:10.5px;letter-spacing:.25em;color:#9C8338;font-weight:700}
.r-no{border:1.5px solid #14233C;border-radius:8px;overflow:hidden;min-width:170px;font-size:12px}
.r-no div{display:flex;justify-content:space-between;gap:10px;padding:4px 10px}
.r-no div+div{border-top:1px solid #D9E0E8}
.r-no b{direction:ltr;color:#14233C}
.r-no span{color:#6B7686}
.r-body{padding:12px 34px 0;display:grid;grid-template-columns:1fr 1fr;gap:6px 26px}
.r-f{display:flex;align-items:baseline;gap:8px;font-size:12.5px;min-width:0}
.r-f.full{grid-column:1/-1}
.r-f .l{color:#6B7686;white-space:nowrap}
.r-f .l .en{font-family:Arial,sans-serif;font-size:9.5px;color:#9AA4B2;margin-right:3px}
.r-f .v{flex:1;border-bottom:1px dotted #9AA4B2;padding:0 4px 2px;font-weight:700;color:#14233C;min-height:21px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.r-amt{margin:12px 34px 0;display:flex;align-items:stretch;border:2px solid #C4A95A;border-radius:10px;overflow:hidden}
.r-amt .big{background:#14233C;color:#fff;padding:8px 18px;display:flex;flex-direction:column;justify-content:center;min-width:190px;text-align:center}
.r-amt .big small{font-size:10.5px;color:#C9D4E1}
.r-amt .big b{font-size:21px;direction:ltr;white-space:nowrap}
.r-amt .words{flex:1;padding:8px 14px;background:#FBF7EA;font-size:12.5px;color:#14233C;display:flex;flex-direction:column;justify-content:center}
.r-amt .words small{color:#9C8338;font-weight:700;font-size:10.5px}
.r-tot{display:flex;gap:8px;margin:10px 34px 0}
.r-tot div{flex:1;background:#F4F6F9;border-radius:8px;padding:5px 10px;font-size:11.5px;color:#6B7686;display:flex;justify-content:space-between;gap:6px}
.r-tot div b{color:#14233C;direction:ltr;white-space:nowrap}
.r-tot div.ok{background:#DDF0E7}.r-tot div.ok b{color:#2E7D5B}
.r-tot div.due{background:#F6DEDE}.r-tot div.due b{color:#B23B3B}
.r-note{margin:8px 34px 0;font-size:11px;color:#6B7686;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-note.int{color:#9C8338}
.r-sign{display:flex;gap:36px;padding:0 34px;margin-top:auto;margin-bottom:10px}
.r-sign div{flex:1;border-top:1px solid #9AA4B2;padding-top:4px;text-align:center;font-size:11px;color:#6B7686}
.sheet.rc .s-foot{margin-top:0;padding:7px 34px 9px;font-size:10.5px}
.sheet.rc .s-stamp{top:385px;left:60px;font-size:18px;padding:4px 14px}
.s-thanks{text-align:center;color:#9C8338;font-weight:700;font-size:13px;padding:26px 40px 8px}
</style>
</head>

const dec=c=>["KWD","BHD","OMR"].includes(c)?3:2;
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};

function calc(inv){
  const sub=(inv.items||[]).reduce((a,it)=>a+num(it.q)*num(it.p),0);
  const disc=Math.min(Math.max(num(inv.discount),0),sub);
  const taxable=sub-disc, tax=taxable*Math.max(num(inv.taxRate),0)/100, total=taxable+tax;
  const paid=Math.max(num(inv.paid),0), bal=Math.max(total-paid,0);
  return {sub,disc,tax,total,paid,bal};
}
function status(inv){
  const c=calc(inv);const eps=Math.pow(10,-dec(inv.currency))/2;
  if(c.total>0&&c.paid>=c.total-eps)return "paid";
  if(c.paid>0)return "partial";
  if(inv.due&&inv.due<today())return "overdue";
  return "unpaid";
}
function blank(){
  const c=co();const d=today();
  return {id:null,number:"",date:d,due:addDays(d,num(c.dueDays)||14),client:{name:"",phone:"",email:"",address:""},ref:"",
    items:[{d:"",q:1,p:0}],discount:0,taxRate:0,paid:0,currency:c.currency||"KWD",notes:"",internal:""};
}
function clone(o){return JSON.parse(JSON.stringify(o))}

let toastT;
function toast(msg,err){const t=$("#toast");t.textContent=msg;t.className="toast"+(err?" err":"");t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3200)}

function paintSync(){
  const el=$("#sync"),tx=$("#syncTxt");
  el.className="sync "+(S.dbState==="live"?"on":S.dbState==="off"?"off":"");
  tx.textContent=S.dbState==="live"?"مباشر · متزامن":S.dbState==="off"?"غير متصل":"جارٍ الاتصال…";
  document.querySelectorAll(".tab").forEach(b=>{
    b.setAttribute("aria-selected",String(b.dataset.tab===S.tab));
    if(b.dataset.tab==="edit")b.textContent=(S.tab==="edit"&&S.cur&&S.cur.id)?"تعديل فاتورة":"فاتورة جديدة";
    if(b.dataset.tab==="redit")b.textContent=(S.tab==="redit"&&S.rcur&&S.rcur.id)?"تعديل وصل":"وصل جديد";
  });
}
function notices(){
  let h="";
  if(S.dbState==="off")h+='<div class="notice">الحفظ غير متاح في هذا العرض، ويمكنك إنشاء الفواتير وتنزيلها دون حفظها. افتح الصفحة من رابطها في Claude للحفظ.</div>';
  else if(!S.canWrite)h+='<div class="notice">لديك صلاحية العرض فقط. اطلب من المالك صلاحية «مساهم» لإنشاء الفواتير وتعديلها.</div>';
  return h;
}

/* ---------- LIST ---------- */
function renderList(){
  const c=co();const cur=c.currency;
  const same=S.invoices.filter(i=>(i.currency||cur)===cur);
  let tot=0,col=0,out=0;same.forEach(i=>{const k=calc(i);tot+=k.total;col+=Math.min(k.paid,k.total);out+=k.bal});
  const overdue=S.invoices.filter(i=>status(i)==="overdue").length;
  const q=S.q.trim().toLowerCase();
  let rows=S.invoices.slice().sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.number||"").localeCompare(a.number||""));
  if(S.st!=="all")rows=rows.filter(i=>status(i)===S.st);
  if(q)rows=rows.filter(i=>[i.number,i.client&&i.client.name,i.client&&i.client.phone,i.ref].join(" ").toLowerCase().includes(q));
  let h=notices();
  h+=`<div class="kpis">
    <div class="kpi"><div class="lbl">عدد الفواتير</div><div class="val">${S.invoices.length}</div></div>
    <div class="kpi"><div class="lbl">إجمالي الفواتير</div><div class="val">${fmt(tot,cur)} <small>${cur}</small></div></div>
    <div class="kpi gold"><div class="lbl">المحصّل</div><div class="val">${fmt(col,cur)} <small>${cur}</small></div></div>
    <div class="kpi ${out>0?"neg":""}"><div class="lbl">المستحق${overdue?` · ${overdue} متأخرة`:""}</div><div class="val">${fmt(out,cur)} <small>${cur}</small></div></div>
  </div>`;
  h+=`<div class="sec-head"><div><h2>الفواتير</h2><p>اضغط على أي فاتورة لعرضها أو تعديلها أو تنزيل نسختها.</p></div>
    ${canSave()?'<button class="btn primary" data-act="new">+ فاتورة جديدة</button>':""}</div>`;
  h+='<div class="panel">';
  if(!S.loaded&&S.dbState!=="off"){h+='<div class="empty">جارٍ تحميل الفواتير…</div>'}
  else if(!S.invoices.length){h+=`<div class="empty">لا توجد فواتير بعد. أنشئ أول فاتورة، وستحصل على نسخة للعميل ونسخة للشركة بصيغة صورة أو PDF.<br><button class="btn primary" data-act="new">+ فاتورة جديدة</button></div>`}
  else{
    h+=`<div class="filters"><input id="q" type="search" placeholder="بحث برقم الفاتورة أو اسم العميل أو الهاتف…" value="${esc(S.q)}">
      <select id="st"><option value="all">كل الحالات</option>${Object.keys(ST).map(k=>`<option value="${k}" ${S.st===k?"selected":""}>${ST[k]}</option>`).join("")}</select></div>`;
    if(!rows.length)h+='<div class="empty">لا توجد فواتير مطابقة.</div>';
    else{
      h+=`<div class="tbl-wrap"><table class="list"><thead><tr><th>رقم الفاتورة</th><th>العميل</th><th>التاريخ</th><th>الاستحقاق</th><th>الإجمالي</th><th>المتبقي</th><th>الحالة</th></tr></thead><tbody>`;
      rows.forEach(i=>{const k=calc(i),s=status(i),cu=i.currency||cur;
        h+=`<tr class="row" data-open="${esc(i.id)}"><td class="num"><b>${esc(i.number||"—")}</b></td><td>${esc(i.client&&i.client.name||"—")}</td>
        <td class="num">${fdate(i.date)}</td><td class="num">${fdate(i.due)}</td><td class="num">${fmt(k.total,cu)} ${cu}</td><td class="num">${fmt(k.bal,cu)}</td>
        <td><span class="pill ${s}">${ST[s]}</span></td></tr>`});
      h+="</tbody></table></div>";
    }
  }
  h+="</div>";
  main.innerHTML=h;
}

/* ---------- EDITOR ---------- */
function canSave(){return S.db&&S.canWrite&&S.dbState!=="off"}
function fld(label,key,val,type,extra){
  return `<label class="f">${label}<input data-k="${key}" type="${type||"text"}" value="${esc(val)}" ${extra||""}></label>`;
}

  h+=`<div class="ed"><div class="form" id="form">
  <div class="fs"><h3>العميل</h3>
    <div class="fr one">${fld("اسم العميل / الجهة *","client.name",i.client.name,"text",dis)}</div>
    <div class="fr" style="margin-top:10px">${fld("الهاتف","client.phone",i.client.phone,"tel",dis+' dir="ltr"')}${fld("البريد الإلكتروني","client.email",i.client.email,"email",dis+' dir="ltr"')}</div>

      <label class="f">العملة<select data-k="currency" ${dis}>${CURS.map(x=>`<option ${i.currency===x?"selected":""}>${x}</option>`).join("")}</select></label></div>

    <div class="fr one" style="margin-top:10px">${fld("المرجع / البطولة","ref",i.ref,"text",dis+' placeholder="مثال: بطولة الكويت الرمضانية ٢٠٢٦"')}</div>
  </div>
  <div class="fs"><h3>البنود</h3>
    <div class="item-h"><span>الوصف</span><span>الكمية</span><span>سعر الوحدة</span><span></span></div>
    ${i.items.map((it,n)=>`<div class="item"><input data-k="items.${n}.d" value="${esc(it.d)}" placeholder="مثال: رسوم تسجيل فريق" ${dis}>
      <input data-k="items.${n}.q" type="number" min="0" step="any" value="${esc(it.q)}" dir="ltr" ${dis}>
      <input data-k="items.${n}.p" type="number" min="0" step="any" value="${esc(it.p)}" dir="ltr" ${dis}>

    <div class="fr" style="margin-top:12px">${fld("الخصم (مبلغ)","discount",i.discount,"number",dis+' min="0" step="any" dir="ltr"')}${fld("الضريبة %","taxRate",i.taxRate,"number",dis+' min="0" step="any" dir="ltr"')}</div>
    <div class="fr one" style="margin-top:10px">${fld("المبلغ المدفوع","paid",i.paid,"number",dis+' min="0" step="any" dir="ltr"')}</div>
    <div class="sum" id="sum"></div>
  </div>
  <div class="fs"><h3>ملاحظات</h3>

  <div class="form-actions">

function paintSum(){
  const el=$("#sum");if(!el)return;const i=S.cur,c=calc(i),cu=i.currency;
  el.innerHTML=`<div><span>المجموع الفرعي</span><span class="num">${fmt(c.sub,cu)}</span></div>
    ${c.disc?`<div><span>الخصم</span><span class="num">-${fmt(c.disc,cu)}</span></div>`:""}
    ${c.tax?`<div><span>الضريبة</span><span class="num">${fmt(c.tax,cu)}</span></div>`:""}
    <div class="big"><span>الإجمالي</span><span class="num">${fmt(c.total,cu)} ${cu}</span></div>
    <div><span>المتبقي</span><span class="num">${fmt(c.bal,cu)} ${cu}</span></div>`;
}
function sheetHTML(inv,copy){
  const c=co(),k=calc(inv),cu=inv.currency||c.currency,s=status(inv);
  const items=(inv.items||[]).filter(it=>it.d||num(it.p)||num(it.q)!==1);
  const rows=(items.length?items:[{d:"—",q:0,p:0}]).map((it,n)=>`<tr><td class="c">${n+1}</td><td>${esc(it.d)}</td><td class="q">${esc(num(it.q))}</td><td class="n">${fmt(it.p,cu)}</td><td class="n">${fmt(num(it.q)*num(it.p),cu)}</td></tr>`).join("");
  const isClient=copy==="client";
  const pay=[c.bank&&`البنك: ${esc(c.bank)}`,c.iban&&`IBAN: <span dir="ltr">${esc(c.iban)}</span>`].filter(Boolean).join("<br>");
  let notes="";
  if(inv.notes)notes+=`<div class="blk"><div class="s-lbl">ملاحظات <span class="en">· Notes</span></div><div>${esc(inv.notes)}</div></div>`;
  if(isClient){
    if(pay&&k.bal>0)notes+=`<div class="blk box"><div class="s-lbl">طريقة الدفع <span class="en">· Payment details</span></div><div>${pay}</div></div>`;
    if(c.terms)notes+=`<div class="blk"><div class="s-lbl">الشروط <span class="en">· Terms</span></div><div>${esc(c.terms)}</div></div>`;
  }else{
    notes+=`<div class="blk box"><div class="s-lbl">للاستخدام الداخلي <span class="en">· Internal</span></div><div>الحالة: <b>${ST[s]}</b> · المدفوع <bdi dir="ltr">${fmt(k.paid,cu)}</bdi> من <bdi dir="ltr">${fmt(k.total,cu)} ${cu}</bdi>${inv.internal?"\n"+esc(inv.internal):""}</div></div>`;
  }
  const foot=[c.phone&&`☎ ${esc(c.phone)}`,c.email&&esc(c.email),c.address&&esc(c.address),c.cr&&`س.ت / CR: ${esc(c.cr)}`].filter(Boolean).map(x=>`<span>${x}</span>`).join("");
  return `<div class="s-ribbon ${copy}"><span>${isClient?"نسخة العميل":"نسخة الشركة"}</span><span class="en">${isClient?"CUSTOMER COPY":"OFFICE COPY"}</span></div>
  <div class="s-head"><div class="s-brand"><img src="${LOGO_COLOR}" alt=""><div><b>${esc(c.name)}</b><i>${esc(c.nameEn)}</i>${c.tagline?`<small>${esc(c.tagline)}</small>`:""}</div></div>
    <div class="s-title"><h2>فاتورة</h2><div class="en">INVOICE</div></div></div>
  ${s==="paid"?'<div class="s-stamp">مدفوعة<span class="en">PAID</span></div>':s==="partial"?'<div class="s-stamp partial">مدفوعة جزئيًا<span class="en">PARTIAL</span></div>':""}
  <div class="s-meta">
    <div class="s-bill"><div class="s-lbl">فاتورة إلى <span class="en">· Bill to</span></div><b>${esc(inv.client&&inv.client.name||"—")}</b>
      ${inv.client&&inv.client.phone?`<div dir="ltr" style="text-align:right">${esc(inv.client.phone)}</div>`:""}
      ${inv.client&&inv.client.email?`<div dir="ltr" style="text-align:right">${esc(inv.client.email)}</div>`:""}
      ${inv.client&&inv.client.address?`<div>${esc(inv.client.address)}</div>`:""}</div>
    <table class="s-kv"><tr><td>رقم الفاتورة · No.</td><td>${esc(inv.number||"مسودة")}</td></tr>
      <tr><td>التاريخ · Date</td><td>${fdate(inv.date)}</td></tr>
      <tr><td>الاستحقاق · Due</td><td>${fdate(inv.due)}</td></tr>
      ${inv.ref?`<tr><td>المرجع · Ref</td><td style="direction:rtl">${esc(inv.ref)}</td></tr>`:""}
      <tr><td>العملة · Currency</td><td>${esc(cu)}</td></tr></table>
  </div>
  <table class="s-items"><thead><tr><th class="c">#</th><th>الوصف<span class="en">DESCRIPTION</span></th><th class="q">الكمية<span class="en">QTY</span></th><th class="n">سعر الوحدة<span class="en">UNIT PRICE</span></th><th class="n">المبلغ<span class="en">AMOUNT</span></th></tr></thead><tbody>${rows}</tbody></table>
  <div class="s-bottom"><div class="s-notes">${notes}</div>
    <table class="s-tot"><tr><td>المجموع الفرعي<span class="en">Subtotal</span></td><td>${fmt(k.sub,cu)}</td></tr>
      ${k.disc?`<tr><td>الخصم<span class="en">Discount</span></td><td>-${fmt(k.disc,cu)}</td></tr>`:""}
      ${k.tax?`<tr><td>الضريبة ${esc(num(inv.taxRate))}%<span class="en">Tax</span></td><td>${fmt(k.tax,cu)}</td></tr>`:""}
      <tr class="grand"><td>الإجمالي<span class="en">Total</span></td><td>${fmt(k.total,cu)} ${esc(cu)}</td></tr>
      ${k.paid?`<tr><td>المدفوع<span class="en">Paid</span></td><td>${fmt(Math.min(k.paid,k.total),cu)}</td></tr>`:""}
      <tr class="bal"><td>المبلغ المستحق<span class="en">Balance due</span></td><td>${fmt(k.bal,cu)} ${esc(cu)}</td></tr></table>
  </div>
  ${isClient?`<div class="s-thanks">شكرًا لثقتكم · Thank you for your business</div>`:`<div class="s-sign"><div>توقيع المستلم<br>Received by</div><div>ختم وتوقيع الشركة<br>Company stamp &amp; signature</div></div>`}
  <div class="s-foot">${foot||`<span>${esc(c.name)} · ${esc(c.nameEn)}</span>`}</div>`;
}
function paintSheet(){const el=$("#sheet");if(!el)return;if(S.tab==="redit"){el.className="sheet rc";el.innerHTML=receiptSheetHTML(S.rcur,S.copy)}else{el.className="sheet";el.innerHTML=sheetHTML(S.cur,S.copy)}}
function fitPreview(){
  const w=$("#pvWrap"),sc=$("#scaler");if(!w||!sc)return;
  const avail=w.clientWidth-28, s=Math.min(1,avail/794);
  sc.style.transform=`scale(${s})`;
  const h=$("#sheet").offsetHeight;
  sc.style.height=h+"px";sc.style.marginBottom=(h*s-h)+"px";
}
window.addEventListener("resize",()=>{if(S.tab==="edit"||S.tab==="redit")fitPreview()});

function setPath(o,path,val){const p=path.split(".");let t=o;for(let n=0;n<p.length-1;n++)t=t[p[n]];t[p[p.length-1]]=val}

/* ---------- SETTINGS ---------- */

  const c=co(),dis=canSave()?"":"disabled";

  <div class="panel" style="max-width:760px"><div class="form" id="sform">
    <div class="fr">${f("اسم الشركة (عربي)","name")}${f("اسم الشركة (إنجليزي)","nameEn","text",'dir="ltr"')}</div>
    <div class="fr one">${f("الوصف المختصر","tagline")}</div>
    <div class="fr">${f("الهاتف","phone","tel",'dir="ltr"')}${f("البريد الإلكتروني","email","email",'dir="ltr"')}</div>
    <div class="fr">${f("العنوان","address")}${f("رقم السجل التجاري","cr","text",'dir="ltr"')}</div>
    <div class="fr">${f("اسم البنك","bank")}${f("رقم الآيبان IBAN","iban","text",'dir="ltr"')}</div>
    <div class="fr">${f("بادئة رقم الفاتورة","prefix","text",'dir="ltr"')}
      <label class="f">العملة الافتراضية<select data-s="currency" ${dis}>${CURS.map(x=>`<option ${c.currency===x?"selected":""}>${x}</option>`).join("")}</select></label></div>
    <div class="fr">${f("مدة الاستحقاق (أيام)","dueDays","number",'min="0" dir="ltr"')}${f("بادئة رقم الوصل","receiptPrefix","text",'dir="ltr"')}</div>
    <label class="f">شروط الوصل (تظهر في نسخة العميل من الوصل)<textarea data-s="receiptTerms" ${dis}>${esc(c.receiptTerms)}</textarea></label>
    <label class="f">الشروط (تظهر في نسخة العميل)<textarea data-s="terms" ${dis}>${esc(c.terms)}</textarea></label>
    ${canSave()?'<div class="form-actions"><button class="btn primary" data-act="saveCo">حفظ البيانات</button></div>':""}
  </div></div>`;
}

function render(){
  paintSync();
  if(S.tab==="list")renderList();else if(S.tab==="edit")renderEdit();else if(S.tab==="rlist")renderRList();else if(S.tab==="redit")renderREdit();else renderSettings();
}

/* ---------- Events ---------- */
document.getElementById("tabs").addEventListener("click",e=>{
  const b=e.target.closest(".tab");if(!b)return;
  if(b.dataset.tab==="edit"&&S.tab!=="edit"&&!S.cur)S.cur=blank();
  if(b.dataset.tab==="redit"&&S.tab!=="redit"&&!S.rcur)S.rcur=blankR();
  S.tab=b.dataset.tab;S.delArm=null;render();window.scrollTo(0,0);
});
main.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.k&&S.cur){
    const v=t.type==="number"?(t.value===""?"":num(t.value)):t.value;
    setPath(S.cur,t.dataset.k,v);S.dirty=true;
    if(t.dataset.k==="date"&&!S.cur.id&&t.value)S.cur.due=addDays(t.value,num(co().dueDays)||14),syncDue();
    paintSum();paintSheet();fitPreview();
  }
  if(t.dataset.r&&S.rcur&&t.tagName!=="SELECT"){
    S.rcur[t.dataset.r]=t.type==="number"?(t.value===""?"":num(t.value)):t.value;
    if(t.dataset.r==="fee"&&S.rcur._autoPaid){S.rcur.paid=S.rcur.fee;const pp=main.querySelector('[data-r="paid"]');if(pp)pp.value=S.rcur.paid}
    if(t.dataset.r==="paid")S.rcur._autoPaid=false;
    paintRSum();paintSheet();fitPreview();
  }
  if(t.id==="rq"){S.rq=t.value;const pos=t.selectionStart;renderRList();const q=$("#rq");q.focus();q.setSelectionRange(pos,pos)}
  if(t.id==="q"){S.q=t.value;const pos=t.selectionStart;renderList();const q=$("#q");q.focus();q.setSelectionRange(pos,pos)}
});
function syncDue(){const d=main.querySelector('[data-k="due"]');if(d)d.value=S.cur.due}
main.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="st"){S.st=t.value;renderList()}
  if(t.dataset.k==="currency"){S.cur.currency=t.value;paintSum();paintSheet()}
  if(t.id==="rt"){S.rt=t.value;renderRList()}
  if(t.dataset.r&&t.tagName==="SELECT"&&S.rcur){S.rcur[t.dataset.r]=t.value;paintRSum();paintSheet();fitPreview()}
});

function nextNumber(date,list,prefix){
  const c=co(),y=(date||today()).slice(0,4),pre=(prefix||c.prefix||"PG").trim()||"PG";
  let max=0;(list||S.invoices).forEach(i=>{if(i.year===y&&num(i.seq)>max)max=num(i.seq)});
  const seq=max+1;return {seq,year:y,number:`${pre}-${y}-${String(seq).padStart(4,"0")}`};
}
function cleanInv(i){
  const o=clone(i);delete o.id;
  o.items=(o.items||[]).filter(it=>String(it.d).trim()||num(it.p)).map(it=>({d:String(it.d||"").trim(),q:num(it.q),p:num(it.p)}));
  ["discount","taxRate","paid"].forEach(k=>o[k]=num(o[k]));
  const k=calc(o);o.total=+k.total.toFixed(3);o.balance=+k.bal.toFixed(3);
  return o;
}
async function saveInvoice(btn){
  const i=S.cur;
  if(!String(i.client.name).trim()){toast("أدخل اسم العميل أولًا",true);main.querySelector('[data-k="client.name"]').focus();return}
  if(!(i.items||[]).some(it=>String(it.d).trim()||num(it.p))){toast("أضف بندًا واحدًا على الأقل",true);return}
  btn.disabled=true;btn.textContent="جارٍ الحفظ…";
  try{
    const now=new Date().toISOString();
    if(!i.number){const n=nextNumber(i.date);i.number=n.number;i.seq=n.seq;i.year=n.year}
    const data=cleanInv(i);data.updatedAt=now;
    if(i.id){await S.db.collection("invoices").doc(i.id).set(data)}
    else{data.createdAt=now;const ref=await S.db.collection("invoices").add(data);i.id=ref&&ref.id||null}
    S.cur.items=data.items.length?data.items:[{d:"",q:1,p:0}];
    S.dirty=false;toast("تم حفظ الفاتورة "+i.number);renderEdit();paintSync();
  }catch(err){
    if(!i.id){i.number="";delete i.seq;delete i.year}
    toast(err&&err.code==="quota_exceeded"?"امتلأت سعة قاعدة البيانات. احذف فواتير قديمة ثم حاول مجددًا.":"تعذّر الحفظ. تحقّق من الاتصال وحاول مرة أخرى.",true);
    btn.disabled=false;btn.textContent="حفظ";
    if(err&&err.code==="invalid_argument"){S.canWrite=false;render()}
  }
}

function arWords(n){
  const ones=["","واحد","اثنان","ثلاثة","أربعة","خمسة","ستة","سبعة","ثمانية","تسعة","عشرة","أحد عشر","اثنا عشر","ثلاثة عشر","أربعة عشر","خمسة عشر","ستة عشر","سبعة عشر","ثمانية عشر","تسعة عشر"];
  const tens=["","","عشرون","ثلاثون","أربعون","خمسون","ستون","سبعون","ثمانون","تسعون"];
  const hund=["","مائة","مائتان","ثلاثمائة","أربعمائة","خمسمائة","ستمائة","سبعمائة","ثمانمائة","تسعمائة"];
  const u999=x=>{const h=Math.floor(x/100),r=x%100,p=[];if(h)p.push(hund[h]);if(r){if(r<20)p.push(ones[r]);else{const o=r%10,t=Math.floor(r/10);p.push(o?ones[o]+" و"+tens[t]:tens[t])}}return p.join(" و")};
  if(!n)return "صفر";
  const sc=[null,["ألف","ألفان","آلاف"],["مليون","مليونان","ملايين"],["مليار","ملياران","مليارات"]];
  const parts=[];let i=0;
  while(n>0&&i<4){const g=n%1000;if(g){let w;if(i===0)w=u999(g);else{const [a,b,c]=sc[i];w=g===1?a:g===2?b:g<=10?u999(g)+" "+c:u999(g)+" "+a}parts.unshift(w)}n=Math.floor(n/1000);i++}
  return parts.join(" و");
}
function amountWords(v,cur){
  const [maj,mn,base]=CURN[cur]||[cur,"",100];
  const tot=Math.round(num(v)*base),a=Math.floor(tot/base),b=tot%base,t=[];
  if(a)t.push(arWords(a)+" "+maj);if(b)t.push(arWords(b)+" "+mn);
  return t.length?"فقط "+t.join(" و")+" لا غير":"صفر";
}

}
function rcalc(r){const fee=Math.max(num(r.fee),0),paid=Math.max(num(r.paid),0);return {fee,paid,bal:Math.max(fee-paid,0)}}
function rstatus(r){const k=rcalc(r),eps=Math.pow(10,-dec(r.currency||"KWD"))/2;if(k.paid>0&&k.paid>=k.fee-eps)return "done";if(k.paid>0)return "partial";return "none"}

  try{
    const now=new Date().toISOString();
    if(!r.number){const n=nextNumber(r.date,S.receipts,co().receiptPrefix||"RC");r.number=n.number;r.seq=n.seq;r.year=n.year}
    const d=clone(r);delete d.id;delete d._autoPaid;
    ["fee","paid"].forEach(x=>d[x]=num(d[x]));d.players=d.players===""?"":num(d.players);
    d.balance=+rcalc(d).bal.toFixed(3);d.updatedAt=now;
    if(r.id)await S.db.collection("receipts").doc(r.id).set(d);
    else{d.createdAt=now;const ref=await S.db.collection("receipts").add(d);r.id=ref&&ref.id||null;r.createdAt=now}
    r._autoPaid=false;toast("تم حفظ الوصل "+r.number);renderREdit();paintSync();
  }catch(err){
    if(!r.id){r.number="";delete r.seq;delete r.year}
    toast(err&&err.code==="quota_exceeded"?"امتلأت سعة قاعدة البيانات. احذف سجلات قديمة ثم حاول مجددًا.":"تعذّر الحفظ. تحقّق من الاتصال وحاول مرة أخرى.",true);
    btn.disabled=false;btn.textContent="حفظ";
    if(err&&err.code==="invalid_argument"){S.canWrite=false;render()}
  }
}
async function delReceipt(){
  const r=S.rcur;if(!r.id)return;
  if(S.delArm!==r.id){S.delArm=r.id;renderREdit();setTimeout(()=>{if(S.delArm===r.id){S.delArm=null;if(S.tab==="redit")renderREdit()}},4000);return}
  try{await S.db.collection("receipts").doc(r.id).delete();toast("تم حذف الوصل "+(r.number||""));S.rcur=null;S.delArm=null;S.tab="rlist";render()}
  catch(err){toast("تعذّر الحذف. حاول مرة أخرى.",true)}
}

/* ---------- Export ---------- */
function isR(){return S.tab==="redit"}
function curDoc(){return isR()?S.rcur:S.cur}
function docHTML(copy){return isR()?receiptSheetHTML(S.rcur,copy):sheetHTML(S.cur,copy)}
async function renderCanvas(copy){
  const host=document.createElement("div");
  host.style.cssText="position:fixed;top:0;left:-10000px;width:794px;z-index:-1;pointer-events:none";
  const sh=document.createElement("div");sh.className="sheet"+(isR()?" rc":"");sh.style.boxShadow="none";sh.innerHTML=docHTML(copy);
  host.appendChild(sh);document.body.appendChild(host);
  await Promise.all([...sh.querySelectorAll("img")].map(im=>im.complete?0:new Promise(r=>{im.onload=im.onerror=r})));
  try{
    if(window.htmlToImage&&htmlToImage.toCanvas){
      try{
        let cv=await htmlToImage.toCanvas(sh,{pixelRatio:2,backgroundColor:"#ffffff",skipFonts:true,cacheBust:false});
        cv=await htmlToImage.toCanvas(sh,{pixelRatio:2,backgroundColor:"#ffffff",skipFonts:true,cacheBust:false});
        if(cv&&cv.width>100)return cv;
      }catch(e){}
    }
    if(window.html2canvas)return await html2canvas(sh,{scale:2,backgroundColor:"#ffffff",useCORS:true,logging:false});
    throw new Error("no renderer");
  }finally{host.remove()}
}
function fileBase(copy){
  const n=(curDoc().number||"draft").replace(/[^\w\-]+/g,"_");
  return `${isR()?"Receipt":"Invoice"}_${n}_${copy==="client"?"Customer":copy==="company"?"Office":"Both"}`;
}
async function exportFile(kind,copies,btn){
  const both=copies.length>1;
  const dl=await getDownloads();
  if(!dl){toast("التنزيل غير متاح في هذا العرض. افتح الصفحة من رابطها في Claude.",true);return}
  const old=btn.textContent;btn.disabled=true;btn.textContent="جارٍ التجهيز…";
  try{
    if(kind==="png"){
      for(const cp of copies){
        const cv=await renderCanvas(cp);
        const blob=await new Promise(r=>cv.toBlob(r,"image/png"));
        await dl.save({filename:fileBase(cp)+".png",data:blob});
      }
    }else{
      const {jsPDF}=window.jspdf;let pdf=null;
      if(isR()&&copies.length>1){
        pdf=new jsPDF({unit:"mm",format:"a4",orientation:"portrait",compress:true});
        let y=0;
        for(const cp of copies){const cv=await renderCanvas(cp);const ih=210*cv.height/cv.width;pdf.addImage(cv.toDataURL("image/jpeg",0.93),"JPEG",0,y,210,ih);y+=148.5}
        pdf.setLineDashPattern([2,2],0);pdf.setDrawColor(150);pdf.setLineWidth(0.3);pdf.line(6,148.5,204,148.5);
        copies=[];
      }
      for(const cp of copies){
        const cv=await renderCanvas(cp);
        const wmm=210,hmm=isR()?210*cv.height/cv.width:Math.max(297,210*cv.height/cv.width);
        if(!pdf)pdf=new jsPDF({unit:"mm",format:[wmm,hmm],orientation:"portrait",compress:true});
        else pdf.addPage([wmm,hmm],"portrait");
        const ih=210*cv.height/cv.width;
        pdf.addImage(cv.toDataURL("image/jpeg",0.93),"JPEG",0,0,wmm,ih);
      }
      pdf.setProperties({title:(isR()?"Receipt ":"Invoice ")+(curDoc().number||""),creator:co().nameEn});
      await dl.save({filename:fileBase(both?"both":copies[0])+".pdf",data:pdf.output("blob")});
    }
    toast("تم تجهيز الملف");
  }catch(err){
    const c=err&&err.code;
    if(c==="declined"){}
    else if(c==="rate_limited")toast("هناك نافذة تنزيل مفتوحة بالفعل. أكملها ثم حاول مجددًا.",true);
    else toast("تعذّر إنشاء الملف. حاول مرة أخرى.",true);
  }finally{btn.disabled=false;btn.textContent=old}
}
let dlP=null;
function getDownloads(){
  if(!dlP)dlP=(window.claude&&window.claude.use?window.claude.use("downloads"):Promise.resolve(null)).catch(()=>null);
  return dlP;
}

/* ---------- Boot ---------- */
render();
(async function boot(){
  const db=window.claude&&window.claude.use?await window.claude.use("db").catch(()=>null):null;
  if(!db){S.dbState="off";S.loaded=true;S.rLoaded=true;render();return}
  S.db=db;
  try{const u=await window.claude.use("user");if(u){const w=await u.can("data.write");if(w===false)S.canWrite=false}}catch(e){}
  db.collection("invoices").onSnapshot(snap=>{
    S.invoices=snap.docs.map(d=>Object.assign({id:d.id},d.data()));S.loaded=true;
    if(!snap.metadata||!snap.metadata.fromCache)S.dbState="live";
    if(S.tab==="list")renderList();paintSync();
  },err=>{S.dbState="off";S.loaded=true;S.rLoaded=true;render()});
  db.collection("receipts").onSnapshot(snap=>{
    S.receipts=snap.docs.map(d=>Object.assign({id:d.id},d.data()));S.rLoaded=true;
    if(S.tab==="rlist")renderRList();
  },()=>{S.rLoaded=true;if(S.tab==="rlist")renderRList()});
  db.collection("settings").onSnapshot(snap=>{
    const d=snap.docs.find(x=>x.id==="company");S.company=d?d.data():{};
    if((S.tab==="edit"&&S.cur)||(S.tab==="redit"&&S.rcur)){paintSheet();fitPreview()}
    else if(S.tab==="settings"&&!main.contains(document.activeElement))renderSettings();
    else if(S.tab==="list")renderList();
  },()=>{});
  render();
})();
})();
</script>
