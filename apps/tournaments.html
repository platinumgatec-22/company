<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --navy:#14233C; --steel:#3A5A7A; --steel-2:#6F8BA6; --gold:#C4A95A; --gold-soft:#F3E8CC;
  --bg:#EEF2F6; --surface:#FFFFFF; --ink:#14233C; --muted:#5D6B7C; --line:#D9E0E8;
  --ok:#2E7D5B; --ok-soft:#DDF0E7; --warn:#A8671B; --warn-soft:#F8E9D2; --bad:#B23B3B; --bad-soft:#F6DEDE;
  --head:#14233C; --head-ink:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1624; --surface:#15223A; --ink:#E7ECF3; --muted:#9AA8BA; --line:#26364F;
    --steel:#7E9DBD; --steel-2:#58779A; --gold:#D7C380; --gold-soft:#3A3220;
    --ok:#5CC195; --ok-soft:#173A2D; --warn:#E3A452; --warn-soft:#3B2C17; --bad:#E27070; --bad-soft:#3D1D1F;
    --head:#0A1220; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1624; --surface:#15223A; --ink:#E7ECF3; --muted:#9AA8BA; --line:#26364F;
  --steel:#7E9DBD; --steel-2:#58779A; --gold:#D7C380; --gold-soft:#3A3220;
  --ok:#5CC195; --ok-soft:#173A2D; --warn:#E3A452; --warn-soft:#3B2C17; --bad:#E27070; --bad-soft:#3D1D1F;
  --head:#0A1220; color-scheme:dark;
}
*{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:15px;line-height:1.55;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* Header */
.top{background:var(--head);color:var(--head-ink);border-bottom:3px solid var(--gold)}
.top-in{max-width:1240px;margin:0 auto;padding:18px 20px 16px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{flex:none}
.brand .logo{flex:none;height:52px;width:auto;display:block}
@media (max-width:560px){.brand .logo{height:42px}}
.brand h1{margin:0;font-size:1.25rem;font-weight:700;letter-spacing:0}
.brand p{margin:0;font-size:.82rem;color:#B9C6D6}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sync{display:inline-flex;align-items:center;gap:7px;font-size:.82rem;color:#D5DEE9;padding:6px 10px;border:1px solid rgba(255,255,255,.18);border-radius:999px}
.dot{width:8px;height:8px;border-radius:50%;background:#8795A7}
.sync.on .dot{background:#4CD49A;box-shadow:0 0 0 3px rgba(76,212,154,.25)}
.sync.off .dot{background:#E27070}
.top select,.top .ghost{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:8px;padding:7px 10px;max-width:240px}
.top select option{color:#14233C}

/* Tabs */
nav.tabs{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.tabs-in{max-width:1240px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;padding:0 12px;scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:13px 12px 11px;white-space:nowrap;color:var(--muted);font-weight:500}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold);font-weight:600}

main{max-width:1240px;margin:0 auto;padding:20px}
.notice{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:.9rem}

/* Section heads */
.sec-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px;margin:0 0 14px}
.sec-head h2{margin:0;font-size:1.15rem}
.sec-head p{margin:2px 0 0;color:var(--muted);font-size:.88rem}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-block;text-decoration:none;color:inherit;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:500}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
:root[data-theme="dark"] .btn.primary{background:var(--gold);border-color:var(--gold);color:#14233C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{background:var(--gold);border-color:var(--gold);color:#14233C}}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:.85rem}
.btn[disabled]{opacity:.55;cursor:default}

/* Scoreboard KPIs */
.board{background:var(--navy);color:#fff;border-radius:14px;display:grid;grid-template-columns:repeat(6,1fr);overflow:hidden;margin-bottom:18px}
.kpi{padding:16px 16px 14px;border-inline-start:1px solid rgba(255,255,255,.1)}
.kpi:first-child{border-inline-start:0}
.kpi .lbl{font-size:.8rem;color:#AFC0D3}
.kpi .val{font-size:1.6rem;font-weight:700;line-height:1.2;margin-top:4px;direction:ltr;text-align:start}
[dir="rtl"] .kpi .val{text-align:right}
.kpi .sub{font-size:.78rem;color:#C9D4E1;margin-top:4px}
.kpi.gold .val{color:var(--gold)}
.kpi.neg .val{color:#F19494}
@media (max-width:1000px){.board{grid-template-columns:repeat(3,1fr)}.kpi:nth-child(4){border-inline-start:0}.kpi:nth-child(n+4){border-top:1px solid rgba(255,255,255,.1)}}
@media (max-width:560px){.board{grid-template-columns:repeat(2,1fr)}.kpi{border-inline-start:0!important;border-top:1px solid rgba(255,255,255,.1)}.kpi:nth-child(-n+2){border-top:0}.kpi:nth-child(even){border-inline-start:1px solid rgba(255,255,255,.1)!important}.kpi .val{font-size:1.3rem}}

/* Panels */
.grid{display:grid;gap:16px}
.g-2{grid-template-columns:1.6fr 1fr}
.g-2e{grid-template-columns:1fr 1fr}
@media (max-width:900px){.g-2,.g-2e{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.panel h3{margin:0 0 12px;font-size:1rem}
.panel .hint{color:var(--muted);font-size:.84rem;margin:-6px 0 12px}
.chart-box{position:relative;height:280px}
.chart-box.sm{height:240px}

/* Tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:.8rem;background:color-mix(in srgb,var(--bg) 60%,var(--surface))}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:end;direction:ltr}
[dir="rtl"] td.num,[dir="rtl"] th.num{text-align:left}
.pos{color:var(--ok)} .negv{color:var(--bad)}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:600;background:var(--bg);color:var(--muted)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.gold{background:var(--gold-soft);color:var(--warn)}
.chip.live{background:var(--bad);color:#fff}
.chip.btnchip{border:0}

/* Tournament cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.tcard .row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.tcard h4{margin:0;font-size:1.02rem}
.tcard .meta{color:var(--muted);font-size:.84rem}
.bar{height:6px;background:var(--bg);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;border-top:1px solid var(--line);padding-top:10px}
.trio div{font-size:.78rem;color:var(--muted)}
.trio b{display:block;color:var(--ink);font-size:.95rem;direction:ltr;text-align:start}
[dir="rtl"] .trio b{text-align:right}

/* Match list */
.mlist{display:flex;flex-direction:column;gap:8px}
.match{display:grid;grid-template-columns:1fr auto 1fr auto;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.match .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.match .t.away{text-align:end}
.match .sc{font-weight:700;font-size:1.05rem;direction:ltr;min-width:64px;text-align:center;background:var(--bg);border-radius:6px;padding:2px 8px}
.match .info{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px;color:var(--muted);font-size:.8rem;margin-top:-2px}
.match.is-live{border-color:var(--bad)}

.split{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:150px}
.stat span{display:block;font-size:.78rem;color:var(--muted)}
.stat b{font-size:1.15rem;direction:ltr;display:block;text-align:start}
[dir="rtl"] .stat b{text-align:right}

.empty{text-align:center;padding:40px 16px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px}
.empty p{margin:0 0 12px}

/* Dialog */
dialog{border:0;border-radius:14px;padding:0;width:min(560px,94vw);background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(10,20,40,.35)}
dialog::backdrop{background:rgba(10,20,40,.5)}
.dlg-h{padding:16px 18px;border-bottom:1px solid var(--line);font-weight:700;border-top:3px solid var(--gold);border-radius:14px 14px 0 0}
.dlg-b{padding:16px 18px;display:grid;grid-template-columns:1fr 1fr;gap:12px;max-height:65vh;overflow:auto}
.fld{display:flex;flex-direction:column;gap:4px}
.fld.full{grid-column:1/-1}
.fld label{font-size:.82rem;color:var(--muted);font-weight:500}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);min-width:0}
.fld.chk{flex-direction:row;align-items:center;gap:8px}
.dlg-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.dlg-err{color:var(--bad);font-size:.85rem;grid-column:1/-1;min-height:0}
@media (max-width:520px){.dlg-b{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.tab{transition:color .15s,border-color .15s}}
</style>
</head>

const byT=(c,id)=>S.data[c].filter(x=>x.tournamentId===id);
const sum=(a,f)=>a.reduce((s,x)=>s+num(f(x)),0);

function metricsOf(teams,sponsors,fin){
  const regPaid=sum(teams.filter(x=>x.paid),x=>x.fee), regDue=sum(teams.filter(x=>!x.paid),x=>x.fee);
  const spPaid=sum(sponsors.filter(x=>x.status==="paid"),x=>x.amount), spDue=sum(sponsors.filter(x=>x.status==="confirmed"),x=>x.amount);
  const spPipe=sum(sponsors.filter(x=>x.status==="negotiating"),x=>x.amount);
  const inc=sum(fin.filter(x=>x.type==="income"),x=>x.amount), exp=sum(fin.filter(x=>x.type==="expense"),x=>x.amount);
  const revenue=regPaid+spPaid+inc;
  return {regPaid,regDue,spPaid,spDue,spPipe,inc,exp,revenue,net:revenue-exp,outstanding:regDue+spDue};
}
const tMetrics=id=>metricsOf(byT("teams",id),byT("sponsors",id),byT("finance",id));

function paintChrome(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.getElementById("appTitle").textContent=t("appTitle");
  document.getElementById("appSub").textContent=t("appSub");
  document.getElementById("langBtn").textContent=t("langBtn");
  const sy=document.getElementById("sync");
  sy.className="sync "+(S.dbState==="live"?"on":S.dbState==="offline"?"off":"");
  document.getElementById("syncTxt").textContent=t(S.dbState==="live"?"live":S.dbState==="offline"?"offline":"connecting");
  const f=document.getElementById("filter");
  const ts=[...S.data.tournaments].sort((a,b)=>String(b.startDate||"").localeCompare(String(a.startDate||"")));
  if(S.filter!=="all"&&!ts.find(x=>x.id===S.filter))S.filter="all";
  f.innerHTML=`<option value="all">${esc(t("allT"))}</option>`+ts.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join("");
  f.value=S.filter;
  document.getElementById("tabs").innerHTML=["overview","tournaments","teams","matches","finance","invoices","sponsors"].map(k=>`<button class="tab" role="tab" data-tab="${k}" aria-selected="${S.tab===k}">${esc(t(k))}</button>`).join("");
}

const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function killCharts(){S.charts.forEach(c=>{try{c.destroy()}catch(e){}});S.charts=[];}
function mkChart(id,cfg){
  const el=document.getElementById(id);if(!el||!window.Chart)return;
  Chart.defaults.font.family='"IBM Plex Sans Arabic",system-ui,sans-serif';
  Chart.defaults.color=css("--muted");
  cfg.options=Object.assign({responsive:true,maintainAspectRatio:false,animation:matchMedia("(prefers-reduced-motion: reduce)").matches?false:{duration:400}},cfg.options||{});
  cfg.options.plugins=Object.assign({legend:{rtl:lang==="ar",labels:{boxWidth:12,usePointStyle:true}},tooltip:{rtl:lang==="ar",callbacks:{label:c=>`${c.dataset.label||c.label}: ${money(c.raw)}`}}},cfg.options.plugins||{});
  S.charts.push(new Chart(el,cfg));
}

function head(title,sub,col){
  const addBtn=col&&S.canWrite&&S.db?`<button class="btn primary" data-add="${col}">+ ${esc(t("add"))} ${esc(t("n_"+col))}</button>`:"";
  const exp=col?`<button class="btn" data-export="${col}">${esc(t("exportCsv"))}</button>`:"";
  return `<div class="sec-head"><div><h2>${esc(title)}</h2>${sub?`<p>${esc(sub)}</p>`:""}</div><div class="actions">${exp}${addBtn}</div></div>`;
}
function empty(msg,col){return `<div class="empty"><p>${esc(msg)}</p>${col&&S.canWrite&&S.db?`<button class="btn primary" data-add="${col}">+ ${esc(t("add"))} ${esc(t("n_"+col))}</button>`:""}</div>`;}
function chip(val,prefix){
  const map={unpaid:"warn",overdue:"bad",cancelled:"",issued:"",received:"",live:"live",completed:"",registration:"gold",upcoming:"warn",scheduled:"warn",final:"",paid:"ok",confirmed:"gold",negotiating:"warn",income:"ok",expense:"bad",platinum:"gold",gold:"gold"};
  return `<span class="chip ${map[val]||""}">${esc(t(prefix+val))}</span>`;
}
const editBtn=(c,id)=>S.canWrite&&S.db?`<button class="btn sm" data-edit="${c}" data-id="${esc(id)}">${esc(t("edit"))}</button>`:"";

function vOverview(){
  const T=scopedT(),teams=scoped("teams"),sp=scoped("sponsors"),fin=scoped("finance"),ms=scoped("matches");
  const m=metricsOf(teams,sp,fin);
  const cap=sum(T,x=>x.capacity), liveT=T.filter(x=>x.status==="live").length;
  const collectRate=(m.regPaid+m.spPaid)/((m.regPaid+m.spPaid+m.outstanding)||NaN);
  let h=`<div class="board">
   <div class="kpi"><div class="lbl">${t("k_tour")}</div><div class="val">${T.length}</div><div class="sub">${liveT} ${t("s_live")}</div></div>
   <div class="kpi"><div class="lbl">${t("k_teams")}</div><div class="val">${teams.length}</div><div class="sub">${cap?pct(teams.length/cap)+" "+t("s_fill"):"—"}</div></div>
   <div class="kpi"><div class="lbl">${t("k_rev")}</div><div class="val">${money(m.revenue,1)}</div><div class="sub">${pct(collectRate)} ${t("s_paidRate")}</div></div>
   <div class="kpi"><div class="lbl">${t("k_exp")}</div><div class="val">${money(m.exp,1)}</div><div class="sub">${fin.filter(x=>x.type==="expense").length} ${t("s_items")}</div></div>
   <div class="kpi ${m.net<0?"neg":"gold"}"><div class="lbl">${t("k_net")}</div><div class="val">${money(m.net,1)}</div><div class="sub">${m.revenue?pct(m.net/m.revenue):"—"} ${t("s_margin")}</div></div>
   <div class="kpi"><div class="lbl">${t("k_out")}</div><div class="val">${money(m.outstanding,1)}</div><div class="sub">${t("reg")} ${money(m.regDue,1)}</div></div>
  </div>`;

  setTimeout(()=>{
    // monthly
    const keys=[],now=new Date();
    for(let i=11;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);keys.push(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"));}
    const rev=keys.map(()=>0),ex=keys.map(()=>0);
    const put=(arr,date,v)=>{const k=String(date||"").slice(0,7);const i=keys.indexOf(k);if(i>=0)arr[i]+=num(v);};
    teams.filter(x=>x.paid).forEach(x=>put(rev,x.paidAt||x.createdAt,x.fee));
    sp.filter(x=>x.status==="paid").forEach(x=>put(rev,x.paidAt||x.createdAt,x.amount));
    fin.forEach(x=>put(x.type==="income"?rev:ex,x.date,x.amount));
    const lbls=keys.map(k=>new Date(k+"-01").toLocaleString(lang==="ar"?"ar-KW-u-nu-latn":"en-GB",{month:"short"}));

      const bySport={};S.data.tournaments.forEach(x=>{bySport[x.sport]=(bySport[x.sport]||0)+tMetrics(x.id).revenue;});
      const ks=Object.keys(bySport).filter(k=>bySport[k]>0).sort((a,b)=>bySport[b]-bySport[a]);

function pnlTable(T){

  const rows=T.map(x=>({x,m:tMetrics(x.id),n:byT("teams",x.id).length})).sort((a,b)=>b.m.net-a.m.net);
  return `<div class="tbl-wrap"><table><thead><tr><th>${t("tournament")}</th><th>${t("f_status")}</th><th class="num">${t("teamsCount")}</th><th class="num">${t("revenue")}</th><th class="num">${t("expenses")}</th><th class="num">${t("net")}</th></tr></thead><tbody>`+
   rows.map(r=>`<tr><td><b>${esc(r.x.name)}</b><br><span class="hint" style="margin:0">${esc(t("sp_"+r.x.sport))}</span></td><td>${chip(r.x.status,"st_")}</td><td class="num">${r.n}${r.x.capacity?" / "+num(r.x.capacity):""}</td><td class="num">${money(r.m.revenue)}</td><td class="num">${money(r.m.exp)}</td><td class="num ${r.m.net<0?"negv":"pos"}">${money(r.m.net)}</td></tr>`).join("")+`</tbody></table></div>`;
}
function matchRow(m){
  const has=m.homeScore!==""&&m.homeScore!=null&&m.awayScore!==""&&m.awayScore!=null;
  return `<div class="match ${m.status==="live"?"is-live":""}"><div class="t">${esc(m.home)}</div><div class="sc">${has?esc(num(m.homeScore))+" – "+esc(num(m.awayScore)):"vs"}</div><div class="t away">${esc(m.away)}</div><div>${editBtn("matches",m.id)}</div>
   <div class="info">${chip(m.status,"ms_")}<span>${esc(tName(m.tournamentId))}</span>${m.round?`<span>${esc(m.round)}</span>`:""}<span>${fmtDate(m.date)}</span>${m.court?`<span>${esc(m.court)}</span>`:""}</div></div>`;
}
function upcomingList(ms){

function standings(ms){
  const tb={};const g=n=>tb[n]||(tb[n]={n,P:0,W:0,D:0,L:0,GF:0,GA:0});
  ms.filter(m=>m.status==="final"&&m.homeScore!==""&&m.homeScore!=null&&m.awayScore!==""&&m.awayScore!=null).forEach(m=>{
    const a=g(m.home),b=g(m.away),x=num(m.homeScore),y=num(m.awayScore);
    a.P++;b.P++;a.GF+=x;a.GA+=y;b.GF+=y;b.GA+=x;
    if(x>y){a.W++;b.L++;}else if(x<y){b.W++;a.L++;}else{a.D++;b.D++;}
  });
  return Object.values(tb).map(r=>Object.assign(r,{GD:r.GF-r.GA,Pts:r.W*3+r.D})).sort((a,b)=>b.Pts-a.Pts||b.GD-a.GD||b.GF-a.GF);
}

const dlg=document.getElementById("dlg");let cur=null,delArmed=false;
function fieldHTML(f,val){
  const lab=esc(t(f.label||("f_"+f.k)))+(f.req?" *":"");const id="fld_"+f.k;const v=val==null?"":val;
  const cls="fld"+(f.full?" full":"");
  if(f.type==="check")return `<div class="fld chk full"><input type="checkbox" id="${id}" ${v?"checked":""}><label for="${id}">${lab}</label></div>`;
  if(f.type==="select")return `<div class="${cls}"><label for="${id}">${lab}</label><select id="${id}">${f.opts.map(o=>`<option value="${o}" ${o===v?"selected":""}>${esc(t(f.p+o))}</option>`).join("")}</select></div>`;
  if(f.type==="tref"){const opts=(f.optional?`<option value="">${esc(t("general"))}</option>`:"")+S.data.tournaments.map(x=>`<option value="${esc(x.id)}" ${x.id===v?"selected":""}>${esc(x.name)}</option>`).join("");return `<div class="${cls}"><label for="${id}">${lab}</label><select id="${id}">${opts}</select></div>`;}
  if(f.type==="file"){
    if(!S.assets)return `<div class="${cls}"><label>${lab}</label><p class="hint" style="margin:0">${esc(t("uploadOff"))}${v?` · <a href="/_blob/${esc(v)}" target="_blank" rel="noopener">${esc(t("openFile"))}</a>`:""}</p></div>`;
    return `<div class="${cls}"><label for="${id}">${lab}</label><input id="${id}" type="file" accept="application/pdf,image/png,image/jpeg,image/webp">${v?`<p class="hint" style="margin:0"><a href="/_blob/${esc(v)}" target="_blank" rel="noopener">${esc(t("openFile"))}</a> · ${esc(t("keepFile"))}</p>`:""}</div>`;}
  if(f.type==="team")return `<div class="${cls}"><label for="${id}">${lab}</label><input id="${id}" list="teamList" value="${esc(v)}" autocomplete="off"></div>`;
  return `<div class="${cls}"><label for="${id}">${lab}</label><input id="${id}" type="${f.type}" ${f.type==="number"?'step="any" inputmode="decimal"':""} value="${esc(v)}" ${f.type==="tel"?'dir="ltr"':""}></div>`;
}
function openForm(col,id){
  if(col!=="tournaments"&&SCHEMA[col].some(f=>f.type==="tref"&&!f.optional)&&!S.data.tournaments.length){S.tab="tournaments";render();return;}
  const rec=id?S.data[col].find(x=>x.id===id):null;
  const init=rec?Object.assign({},rec):{};
  if(!rec){
    if(S.filter!=="all")init.tournamentId=S.filter;
    if(col==="finance")init.date=new Date().toISOString().slice(0,10);
    if(col==="invoices"){init.issueDate=today();init.status="unpaid";if(S.invDir!=="all")init.direction=S.invDir;}
    if(col==="teams"&&S.filter!=="all"){const tt=S.data.tournaments.find(x=>x.id===S.filter);if(tt&&tt.entryFee)init.fee=tt.entryFee;}
  }
  cur={col,id:rec?rec.id:null,rec};delArmed=false;
  document.getElementById("dlgTitle").textContent=(rec?t("edit"):t("add"))+" "+t("n_"+col);
  const teamNames=[...new Set((S.filter==="all"?S.data.teams:byT("teams",S.filter)).map(x=>x.name))];
  document.getElementById("dlgBody").innerHTML=SCHEMA[col].map(f=>fieldHTML(f,init[f.k])).join("")+`<datalist id="teamList">${teamNames.map(n=>`<option value="${esc(n)}">`).join("")}</datalist><div class="dlg-err" id="dlgErr"></div>`;
  const del=document.getElementById("dlgDel");del.style.display=rec?"":"none";del.textContent=t("del");
  document.getElementById("dlgCancel").textContent=t("cancel");
  const sv=document.getElementById("dlgSave");sv.textContent=t("save");sv.disabled=false;
  dlg.dir=lang==="ar"?"rtl":"ltr";
  dlg.showModal();
}
async function saveForm(e){
  e.preventDefault();if(!cur||!S.db)return;
  const out={},err=document.getElementById("dlgErr");let missing=false;
  let upFile=null;
  SCHEMA[cur.col].forEach(f=>{
    if(f.type==="file"){const el=document.getElementById("fld_"+f.k);if(el&&el.files&&el.files[0])upFile=[f.k,el.files[0]];out[f.k]=cur.rec&&cur.rec[f.k]?cur.rec[f.k]:"";return;}
    const el=document.getElementById("fld_"+f.k);let v=f.type==="check"?el.checked:el.value.trim();
    if(f.type==="number")v=v===""?"":Number(v);
    if(f.req&&(v===""||v==null))missing=true;out[f.k]=v;});
  if(missing){err.textContent=t("required");return;}
  const sv=document.getElementById("dlgSave");sv.disabled=true;sv.textContent=t("saving");
  if(upFile){
    const fl=upFile[1],okT=["application/pdf","image/png","image/jpeg","image/webp"];
    const ext=(fl.name.split(".").pop()||"").toLowerCase();
    const typ=okT.includes(fl.type)?fl.type:({pdf:"application/pdf",png:"image/png",jpg:"image/jpeg",jpeg:"image/jpeg",webp:"image/webp"}[ext]||"");
    const fail=m=>{sv.disabled=false;sv.textContent=t("save");err.textContent=t(m);};
    if(!typ)return fail("fileTypeErr");
    if(fl.size>20*1024*1024)return fail("fileSizeErr");
    sv.textContent=t("uploading");
    try{const r=await S.assets.upload(fl,{type:typ});out[upFile[0]]=r.id;}
    catch(x){const c=x&&x.code;return fail(c==="unsupported_type"?"fileTypeErr":c==="too_large"?"fileSizeErr":c==="quota_or_state"?"quotaErr":"uploadErr");}
    sv.textContent=t("saving");
  }
  const nowIso=new Date().toISOString();
  try{
    if(cur.col==="teams"&&out.paid&&!(cur.rec&&cur.rec.paid))out.paidAt=nowIso;
    if(cur.col==="sponsors"&&out.status==="paid"&&!(cur.rec&&cur.rec.status==="paid"))out.paidAt=nowIso;
    if(cur.rec){const base=Object.assign({},cur.rec);delete base.id;await S.db.collection(cur.col).doc(cur.id).set(Object.assign(base,out,{updatedAt:nowIso}));}
    else await S.db.collection(cur.col).add(Object.assign(out,{createdAt:nowIso}));
    dlg.close();
  }catch(x){sv.disabled=false;sv.textContent=t("save");err.textContent=writeErr(x);}
}
function writeErr(x){
  const c=x&&x.code;
  if(c==="invalid_argument"||c==="not_granted"){S.canWrite=false;render();return t("readonlyNote");}
  if(c==="quota_exceeded")return t("quotaErr");
  return t("saveErr");
}
async function delRec(){
  const b=document.getElementById("dlgDel");
  if(!delArmed){delArmed=true;b.textContent=t("delConfirm");return;}
  b.disabled=true;
  try{await S.db.collection(cur.col).doc(cur.id).delete();dlg.close();}catch(x){document.getElementById("dlgErr").textContent=writeErr(x);}
  b.disabled=false;
}
document.getElementById("dlgForm").addEventListener("submit",saveForm);
document.getElementById("dlgCancel").addEventListener("click",()=>dlg.close());
document.getElementById("dlgDel").addEventListener("click",delRec);

/* ---------- CSV export ---------- */
async function exportCsv(col){
  const data=col==="tournaments"?scopedT():scoped(col);
  const keys=SCHEMA[col].filter(f=>f.type!=="file").map(f=>f.k);
  const lab=keys.map(k=>t(SCHEMA[col].find(f=>f.k===k).label||("f_"+k)));
  const cell=v=>{const s=String(v==null?"":v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
  const val=(r,k)=>k==="tournamentId"?tName(r[k]):k==="paid"?(r[k]?t("sp_paid"):t("pending")):(SCHEMA[col].find(f=>f.k===k).p?t(SCHEMA[col].find(f=>f.k===k).p+r[k]):r[k]);
  const csv="\uFEFF"+[lab.map(cell).join(",")].concat(data.map(r=>keys.map(k=>cell(val(r,k))).join(","))).join("\n");
  const dl=await window.claude?.use?.("downloads").catch(()=>null);
  const name=`platinum-gate-${col}-${new Date().toISOString().slice(0,10)}.csv`;
  if(dl){try{await dl.save({filename:name,data:csv});}catch(e){}}
}

/* ---------- Events ---------- */
document.addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.tab){S.tab=b.dataset.tab;try{localStorage.setItem("pg-tab",S.tab)}catch(x){}render();window.scrollTo({top:0});}
  else if(b.dataset.add)openForm(b.dataset.add);
  else if(b.dataset.edit)openForm(b.dataset.edit,b.dataset.id);
  else if(b.dataset.export)exportCsv(b.dataset.export);
  else if(b.dataset.invdir){S.invDir=b.dataset.invdir;render();}
  else if(b.dataset.focus){S.filter=b.dataset.focus;S.tab="overview";render();}
  else if(b.dataset.toggle&&S.db){const r=S.data.teams.find(x=>x.id===b.dataset.toggle);if(!r)return;b.disabled=true;
    const patch={paid:!r.paid,updatedAt:new Date().toISOString()};if(!r.paid)patch.paidAt=patch.updatedAt;
    try{await S.db.collection("teams").doc(r.id).update(patch);}catch(x){writeErr(x);}b.disabled=false;}
  else if(b.id==="langBtn"){lang=lang==="ar"?"en":"ar";try{localStorage.setItem("pg-lang",lang)}catch(x){}render();}
});
document.getElementById("filter").addEventListener("change",e=>{S.filter=e.target.value;render();});

/* ---------- Live data ---------- */
render();
(async()=>{
  const db=window.claude&&window.claude.use?await window.claude.use("db"):null;
  if(!db){S.dbState="offline";S.canWrite=false;COLS.forEach(c=>S.loaded[c]=true);render();return;}
  S.db=db;
  try{S.assets=window.claude.use?await window.claude.use("assets"):null;}catch(e){S.assets=null;}
  try{const u=window.claude.use?await window.claude.use("user"):null;if(u){const w=await u.can("data.write");if(w===false)S.canWrite=false;}}catch(e){}
  COLS.forEach(c=>{
    db.collection(c).onSnapshot(snap=>{
      S.data[c]=snap.docs.map(d=>Object.assign({id:d.id},d.data()));S.loaded[c]=true;
      if(!snap.metadata.fromCache)S.dbState="live";
      if(!dlg.open)render();else paintChrome();
    },err=>{if(err&&err.code==="revoked"){S.dbState="offline";S.canWrite=false;}render();});
  });
  dlg.addEventListener("close",render);
})();
})();
</script>
