# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: company-portal
    runtime: node
    # A paid plan is needed for the persistent disk that keeps the SQLite database.
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DB_PATH
        value: /var/data/company.db
      - key: COMPANY_NAME
        sync: false
      # Digital employees (see README): Claude texts, and the Make scenario for designs + Buffer.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: WORKFLOW_WEBHOOK_URL
        sync: false
      - key: WORKFLOW_CALLBACK_TOKEN
        generateValue: true
      # Decisions portal → Make MCP server.
      - key: MAKE_MCP_URL
        sync: false
      - key: MAKE_MCP_TOKEN
        sync: false
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
