# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: company-portal
    runtime: node
    # A paid plan is needed for the persistent disk that keeps the SQLite database.
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DB_PATH
        value: /var/data/company.db
      - key: COMPANY_NAME
        sync: false
      # Optional: integrations can also be set from Atlas → الأتمتة (admin).
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MAKE_WEBHOOK_URL
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: TZ
        value: Asia/Kuwait
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
